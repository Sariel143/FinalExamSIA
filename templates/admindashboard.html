<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      height: 100vh;
      background-color: #2c3e50;
      color: white;
      position: fixed;
      left: 0;
      top: 0;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
    }
    .sidebar h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .sidebar ul {
      list-style: none;
      padding: 0;
    }
    .sidebar ul li {
      padding: 15px 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }
    .sidebar ul li:hover {
      background-color: #34495e;
    }
    .sidebar ul li a {
      color: white;
      text-decoration: none;
      display: block;
    }

    /* Header */
    .header {
      margin-left: 250px;
      padding: 20px;
      background-color: #ecf0f1;
      border-bottom: 2px solid #dcdcdc;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    /* Main Content */
    .main-content {
      margin-left: 250px;
      padding: 20px;
    }
    .card {
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }
    .card h3 {
      margin-top: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>Admin Panel</h2>
  <ul>
    <li><a href="#dashboard">Dashboard</a></li>
    <li><a href="#users">Users</a></li>
    <li><a href="#settings">Settings</a></li>
    <li><a href="#reports">Reports</a></li>
    <li><a href="#logout">Logout</a></li>
  </ul>
</div>

<!-- Header -->
<div class="header">
  <h1>Welcome, Admin</h1>
</div>

<!-- Main Content -->
<div class="main-content">
  <div class="grid">
    <div class="card">
      <h3>Total Users</h3>
      <p id="totalUsers">Loading...</p>
    </div>
    <div class="card">
      <h3>New Orders</h3>
      <p id="newOrders">Loading...</p>
    </div>
    <div class="card">
      <h3>Revenue</h3>
      <p id="revenue">Loading...</p>
    </div>
  </div>
  <div class="card">
    <h3>Recent Activity</h3>
    <p id="recentActivity">Loading...</p>
  </div>
</div>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDRWHg-kC_MzMnMUAF4IkgPyY6LbOoQT00",
    authDomain: "sia2pipeline-251dd.firebaseapp.com",
    projectId: "sia2pipeline-251dd",
    storageBucket: "sia2pipeline-251dd.firebasestorage.app",
    messagingSenderId: "109506453905",
    appId: "1:109506453905:web:3f4ba60c7198b15769ba30",
    measurementId: "G-GY2VT83RGV"
  };

  // Initialize Firebase
  const app = firebase.initializeApp(firebaseConfig);
  const database = firebase.database(app);
  const firestore = firebase.firestore(app);

  // Fetch data from Firebase
  async function fetchDashboardData() {
    // Fetch total users (replace with your actual data path)
    const usersSnapshot = await firestore.collection('users').get();
    const totalUsers = usersSnapshot.size;

    // Fetch new orders (replace with your actual data path)
    const ordersSnapshot = await firestore.collection('orders').where('status', '==', 'new').get();
    const newOrders = ordersSnapshot.size;

    // Fetch revenue (replace with your actual data path)
    const revenueSnapshot = await firestore.collection('orders').where('status', '==', 'completed').get();
    let revenue = 0;
    revenueSnapshot.forEach(order => {
      revenue += order.data().amount; // Assuming 'amount' field in order data
    });

    // Fetch recent activity (replace with your actual data path)
    const activitySnapshot = await firestore.collection('activity').orderBy('timestamp', 'desc').limit(5).get();
    let recentActivity = '';
    activitySnapshot.forEach(doc => {
      recentActivity += `<p>${doc.data().description}</p>`;
    });

    // Update the DOM
    document.getElementById('totalUsers').innerText = totalUsers;
    document.getElementById('newOrders').innerText = newOrders;
    document.getElementById('revenue').innerText = `₱${revenue.toFixed(2)}`;
    document.getElementById('recentActivity').innerHTML = recentActivity;
  }

  // Call the fetch data function
  fetchDashboardData();
</script>

</body>
</html>
